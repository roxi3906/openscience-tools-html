services:
  web:
    build:
      context: .
    # image: ghcr.io/aipoch/openscience-tools-html:latest
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
